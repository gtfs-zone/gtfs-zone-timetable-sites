default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.9
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: daisyui-css
        name: build style.css
        entry: pnpm run build:css
        language: system
        files: ^(src/gtfs_zone_timetable_sites/templates/.*\.(html|css)|package\.json)$
        exclude: ^src/gtfs_zone_timetable_sites/templates/style\.css$
        pass_filenames: false
        stages: [pre-commit]
      - id: root-js
        name: build root.js
        entry: sh -c 'pnpm run check:js && pnpm run build:js'
        language: system
        files: ^(src/js/.*\.ts|package\.json|tsconfig\.json)$
        pass_filenames: false
        stages: [pre-commit]
      - id: check
        name: check
        entry: scripts/check.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]
