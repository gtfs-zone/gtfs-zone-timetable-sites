[project]
name = "gtfs-zone-timetable-sites"
version = "0.16.0"
requires-python = ">=3.13"
description = "Static GTFS timetable sites for sites.gtfs.zone"
license = "AGPL-3.0-or-later"
dependencies = [
    "anyascii>=0.3.3",
    "jinja2>=3.1",
    "markupsafe>=2",
    "pydantic>=2.9",
    "pykakasi>=2.3.0",
    "pyyaml>=6.0",
    "reverse-geocode>=1.6.6",
]

[project.optional-dependencies]
# dagster pinned to feed-catalog's: this is a code location in its instance.
pipeline = [
    "boto3>=1.35",
    "botocore>=1.35",
    "dagster==1.13.24",
    "dagster-postgres==0.29.24",
    "httpx>=0.27",
]

[project.scripts]
timetable-sites = "gtfs_zone_timetable_sites.cli:main"

[project.urls]
Homepage = "https://sites.gtfs.zone"
Source = "https://github.com/gtfs-zone/gtfs-zone-timetable-sites"

[dependency-groups]
dev = [
    "commitizen",
    "dagster-webserver==1.13.24",
    "deptry>=0.25.1",
    "pytest>=8.0",
    "ruff",
    "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtfs_zone_timetable_sites"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests take fixtures by name and return nothing worth annotating.
"tests/**" = ["ANN"]

[tool.vulture]
paths = ["src"]
# Used only through a framework: routes, validators, tasks, ORM fields
ignore_decorators = ["@app.*", "@router.*", "@field_validator", "@model_validator", "@asset"]
ignore_names = [
    "cls",
    "model_config",
    "defs",
    # Read only by the Jinja templates
    "days_label",
    "dot_x",
    "google",
    "gutter",
    "icons",
    "phone",
    "rail",
    "show_amenities",
    "show_headsigns",
    "show_notes",
    "show_numbers",
    "solid",
    "state_label",
]

[tool.deptry]
per_rule_ignores.DEP002 = [
    "dagster-postgres",  # run storage, named in the infra dagster.yaml
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
annotated_tag = true
bump_message = "chore(release): bump version $current_version -> $new_version"
pre_bump_hooks = [
    "bash -c 'branch=$(git branch --show-current); [ \"$branch\" = \"main\" ] || { echo \"Error: cz bump must be run on main (currently on \\\"$branch\\\")\"; exit 1; }'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
