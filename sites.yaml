defaults:
  map: svg                 # svg | none
  horizon_days: 28         # window used to derive day types and effective dates
  time_format: 12h         # 12h | 24h
  timepoints: auto         # auto | all | timepoint-flag
  basemap: stadia-toner-dark  # none | a stadia-* style | {light: <style>, dark: <style>}
  locale: en               # en | fr: the language of the site's pages
  index: true              # whether search engines may index the site's pages

# Feeds from data.gtfs.zone/feeds.json that become sites on their own, with a
# slug from the romanized feed name (plus its subtitle or place when several
# feeds share the name) pinned in the bucket's slugs.json. Only feeds whose
# schedule is up are taken. time_format and locale come from the feed's country.
catalog:
  countries: []            # ISO codes, empty for all
  exclude_countries: []    # ISO codes
  require_country: true    # skip feeds without a country code
  max_bytes: 50000000      # skip larger zips; they need more than a worker's memory
  exclude: []              # feed ids
  index_countries: [US, CA] # ISO codes whose sites search engines index, empty for all

# Feeds `timetable-sites dev` builds, a mix of modes, sizes and countries.
dev:
  - f-1f748c5476           # MBTA: subway, light rail, train, bus, ferry
  - f-2f033a022e           # Amtrak: long-distance train and bus
  - f-da2e3cdeed           # Big Blue Bus: bus only
  - f-f253731f03           # Columbia County: small, end date years out
  - f-c485850b86           # Halifax Transit: bus and ferry, Canada
  - f-eaa9f8e31c           # BC Ferries: ferry only, Canada

# Each site takes either `feed:` (a feed id from feeds.json, listed whatever the
# catalog filter says) or `url:` (a direct GTFS zip URL, with a `slug:`), plus
# any option from `defaults` to override it. A feed's slug is optional.
sites: []
